# Gate config for /staff:build (staff_gate.py). Keep it git-excluded (stack.sh does this).
# Commands are argument lists, run from the repo root without a shell.

# Full test suite.
test_command = ["uv", "run", "pytest", "-q"]

# Folders whose .py files count as tests (test_*.py, *_test.py and conftest.py count anywhere).
test_roots = ["tests"]

# Extra files whose change can weaken the checks, as git globs. Locking a task hashes these
# plus the built-in list (pyproject.toml, setup.cfg, pytest.ini, tox.ini, ruff and mypy config,
# .coveragerc, CI workflows, every conftest.py) and this file.
protected_config = ["app/settings*.py"]

# Minimum percent of changed source lines the tests must run. Needs pytest-cov in the test
# environment; without this key, or without pytest-cov, coverage is reported as not measured.
# coverage_threshold = 80

# Only tools this repo already uses; delete the rest. The changed .py files are appended.
[tools]
format = ["uv", "run", "ruff", "format", "--check"]
lint = ["uv", "run", "ruff", "check"]
typecheck = ["uv", "run", "mypy"]
